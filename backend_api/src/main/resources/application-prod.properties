spring.application.name=chemistry-qb-backend
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
ingestion.chunk.max-chars=${INGESTION_CHUNK_MAX_CHARS:7000}
ingestion.chunk.delay-ms=${INGESTION_CHUNK_DELAY_MS:2500}
ingestion.chunk.max-questions=${INGESTION_CHUNK_MAX_QUESTIONS:8}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
APP_DOMAIN=${APP_DOMAIN:https://chemistry-qb-engine.vercel.app}
