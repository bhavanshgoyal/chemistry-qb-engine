spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chemistryqb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
ingestion.chunk.max-chars=${INGESTION_CHUNK_MAX_CHARS:7000}
ingestion.chunk.delay-ms=${INGESTION_CHUNK_DELAY_MS:2500}
ingestion.chunk.max-questions=${INGESTION_CHUNK_MAX_QUESTIONS:8}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
